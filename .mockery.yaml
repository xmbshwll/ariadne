with-expecter: true
disable-version-string: true
issue-845-fix: true
resolve-type-alias: false
testonly: false

# The Adapter interface is declared once, in internal/adapters, and every Music
# Service adapter implements it. One generated mock serves every consumer that
# needs a stand-in adapter.
dir: "{{.ConfigDir}}/internal/mocks"
filename: "{{.InterfaceNameSnake}}_mock.go"
mockname: "Mock{{.InterfaceName}}"
outpkg: mocks

packages:
  github.com/xmbshwll/ariadne/internal/adapters:
    interfaces:
      Adapter:
