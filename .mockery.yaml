with-expecter: true
disable-version-string: true
issue-845-fix: true
resolve-type-alias: false
testonly: false

# Adapter interfaces are declared once, in internal/resolve. The public package
# re-exports them as aliases, so one generated mock set serves both call sites.
dir: "{{.ConfigDir}}/internal/mocks"
filename: "{{.InterfaceNameSnake}}_mock.go"
mockname: "Mock{{.InterfaceName}}"
outpkg: mocks

packages:
  github.com/xmbshwll/ariadne/internal/resolve:
    interfaces:
      SourceAdapter:
      AlbumTargetSearcher:
      SongSourceAdapter:
      SongTargetSearcher:
