version: "2"

run:
  timeout: 3m
  tests: true

linters:
  enable:
    - bodyclose
    - copyloopvar
    - dupword
    - errcheck
    - errorlint
    - exptostd
    - gocyclo
    - gocritic
    - godot
    - intrange
    - err113
    - misspell
    - modernize
    - perfsprint
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - revive
    - testableexamples
    - thelper
    - unconvert
    - unparam
    - wrapcheck
    - usestdlibvars
    - usetesting
    - whitespace
  exclusions:
    rules:
      # External test packages assert on the exact error a call returned
      # (errors.Is against a sentinel), so wrapping it would only add noise.
      - path: _test\.go
        linters: [wrapcheck]
      # The adapter base and the contract harness hand back the shared
      # adapters.ErrUnsupported error unchanged on purpose; wrapping it would
      # repeat the same sentence in every provider's error text.
      - path: internal/adapters/(base|adaptertest)/
        linters: [wrapcheck]
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    misspell:
      locale: US
      ignore-rules:
        - Catalogue
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
